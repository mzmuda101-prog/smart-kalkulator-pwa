<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Próba GPU</title>
<style>
  :root { --bg: #fff; --fg: #111; --muted: #555; }
  @media (prefers-color-scheme: dark) { :root { --bg: #111; --fg: #eee; --muted: #aaa; } }
  body { background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, sans-serif; margin: 0; padding: 16px; }
  button { font: inherit; padding: 12px 16px; min-height: 44px; margin: 0 8px 8px 0; }
  pre { white-space: pre-wrap; overflow-wrap: anywhere; color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<h1>Próba GPU</h1>
<p>1: szybkość zwykłego JS. 2: model na karcie graficznej (WebGPU), 8 wzorów.</p>
<p><button id="js">1. Test JS</button><button id="gpu">2. Model na GPU</button></p>
<p id="bar"></p>
<pre id="log"></pre>
<script type="module">
import * as ort from './ort/ort.webgpu.min.mjs';
const log = s => { document.getElementById('log').textContent += s + '\n'; };
const bar = document.getElementById('bar');
const IDS = '1a 1b 1c 1d 1e 1f 1g 2a'.split(' ');
log(`WebGPU: ${'gpu' in navigator ? 'jest' : 'BRAK'}; ${navigator.userAgent}`);

document.getElementById('js').onclick = () => {
  const t0 = performance.now(); let s = 0;
  for (let i = 0; i < 3e7; i++) s += Math.sin(i) * 1e-9;
  const a = new Float32Array(1 << 20); for (let k = 0; k < 30; k++) for (let i = 0; i < a.length; i++) a[i] = a[i] * 0.5 + i;
  log(`JS: ${Math.round(performance.now() - t0)} ms (Mac: ok. 300–500 ms)`);
};

document.getElementById('gpu').onclick = async () => {
  try {
    ort.env.wasm.numThreads = 1;
    ort.env.wasm.wasmPaths = new URL('./ort/', location.href).href;
    let t0 = performance.now();
    const resp = await fetch('model_wq.onnx'); const size = +resp.headers.get('content-length');
    const reader = resp.body.getReader(); const parts = []; let got = 0;
    for (;;) { const { done, value } = await reader.read(); if (done) break; parts.push(value); got += value.length; bar.textContent = `Pobrano ${(got / 1e6).toFixed(1)} z ${(size / 1e6).toFixed(0)} MB`; }
    const buf = new Uint8Array(got); let off = 0; for (const p of parts) { buf.set(p, off); off += p.length; } parts.length = 0;
    log(`pobranie ${Math.round((performance.now() - t0) / 1000)} s`); bar.textContent = 'Wczytuję model na GPU…';
    t0 = performance.now();
    const sess = await ort.InferenceSession.create(buf, { executionProviders: ['webgpu', 'wasm'] });
    log(`wczytanie ${Math.round(performance.now() - t0)} ms`); bar.textContent = 'Czytam wzory…';
    let tot = 0; const out = {};
    for (const id of IDS) {
      const x = new Float32Array(await (await fetch(`x/${id}.bin`)).arrayBuffer());
      t0 = performance.now();
      const r = await sess.run({ x: new ort.Tensor('float32', x, [1, 1, 384, 384]) });
      const ms = performance.now() - t0; tot += ms;
      out[id] = Array.from(r[sess.outputNames[0]].data, Number);
      log(`${id}: ${Math.round(ms)} ms, ${out[id].length} tokenów`);
    }
    log(`ŚREDNIO ${Math.round(tot / IDS.length)} ms/wzór`); bar.textContent = 'Gotowe.';
    window.__wynik = out;
  } catch (e) { log('BŁĄD: ' + (e && e.message || e)); }
  window.__gotowe = true;
};
</script>
</body>
</html>
